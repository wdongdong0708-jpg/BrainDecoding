dataset:
  name: ChineseEEG1_SR
  root: ${BRAINDATA_ROOT}/ChineseEEG
  preprocessed_dir: derivatives/preproc/filtered_0.5_30
  stimulus_dir: derivatives/novels/segmented_novel
  text_embedding_dir: derivatives/text_embeddings

  # 可选 GarnettDream、LittlePrince 或 all；当前只冻结了 LittlePrince 的行级协议。
  novel: LittlePrince

  # 固定窗口从 ROWS 开始，3.5 秒在 256 Hz 下恰好是 896 点。
  sampling_rate_hz: 256
  window_seconds: 3.5
  highlighted_character_count: 10
  embedding_dimension: 768

split:
  by_novel:
    LittlePrince:
      train: [1, 2, 3, 4, 5]
      val: [6]
      test: [7]

cache_dir: cache/ChineseEEG1_SR

field_names:
  dataset: 数据集
  subject_id: 被试编号
  novel: 小说
  run_id: Run编号
  recording_id: 记录编号
  row_id: 行编号
  text: 文本内容
  text_id: 文本ID
  eeg_path: EEG文件
  row_start_sample: 行开始采样点
  row_stop_sample: 行结束采样点
  window_start_sample: 窗口开始采样点
  window_stop_sample: 窗口结束采样点
  fixed_sample_count: 固定窗口采样点数
  row_start_seconds: 行开始时间秒
  row_stop_seconds: 行结束时间秒
  measured_duration_seconds: 实测行时长秒
  highlighted_character_count: 高亮字符数
  bert_path: BERT文件
  bert_row_index: BERT行索引0基
  is_chapter_number: 是否章节编号
  overlaps_bad_segment: 是否与坏段重叠
  window_inside_row: 固定窗口是否完整
  is_trainable: 是否可训练
  exclusion_reason: 排除原因
  split: 数据划分

model:
  embedding_dimension: 768
  # 共享傅里叶空间层：128 个真实电极映射为 64 个虚拟通道。
  virtual_channels: 64
  fourier_harmonics: 8
  spatial_margin: 0.1
  dropout: 0.1

training:
  event_table: cache/ChineseEEG1_SR/ChineseEEG_LittlePrince_run_split.xlsx
  output_dir: outputs/ChineseEEG1_SR/LittlePrince_fourier_subject_row_retrieval
  seed: 42
  device: auto
  batch_size: 64
  num_workers: 0
  epochs: 50
  patience: 8
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  temperature: 0.07
  amp: true
  top_ks: [1, 5, 10]
  smoke_rows: 32

closed_set_diagnostic:
  output_dir: outputs/ChineseEEG1_SR/LittlePrince_closed_set_loso
  bootstrap_repetitions: 2000
  smoke_texts: 32
