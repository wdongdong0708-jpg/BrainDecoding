[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "braindecoding"
version = "0.1.0"
description = "可复现的 EEG/MEG 语言解码数据与实验工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py",
  "matplotlib",
  "mne",
  "numpy",
  "openpyxl",
  "pandas",
  "PyYAML",
  "scikit-learn",
  "scipy",
  "torch",
  "transformers",
]

[project.scripts]
brain-decoding = "braindecoding.cli:main"

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
cache_dir = ".pytest_tmp/cache"

[tool.setuptools.packages.find]
include = ["braindecoding*"]
